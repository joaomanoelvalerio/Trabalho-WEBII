<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="col-12 col-md-10 col-lg-8">
    <div class="card shadow-sm p-4">

      <h1 class="text-center mb-1">Crie sua Conta</h1>

      <div class="steps-indicator mb-4">
        <div class="step" [class.active]="currentStep === 1" [class.done]="currentStep === 2">
          <span class="step-number">1</span>
          <span class="step-label">Dados Pessoais</span>
        </div>
        <div class="step-line"></div>
        <div class="step" [class.active]="currentStep === 2">
          <span class="step-number">2</span>
          <span class="step-label">Endereço</span>
        </div>
      </div>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        
        <div *ngIf="errorMessage" class="alert alert-danger text-center fw-bold mb-3">
          {{ errorMessage }}
        </div>
        
        <div *ngIf="currentStep === 1">
          <div class="row">
            
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Nome Completo:</label>
              <input type="text" class="form-control" name="name" 
                     [(ngModel)]="user.name" #nameCtrl="ngModel" 
                     [class.is-invalid]="nameCtrl.invalid && nameCtrl.touched" required />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">E-mail:</label>
              <input type="email" class="form-control" name="email" 
                     [(ngModel)]="user.email" #emailCtrl="ngModel" 
                     [class.is-invalid]="emailCtrl.invalid && emailCtrl.touched" required email />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">CPF:</label>
              <input type="text" class="form-control" name="cpf" 
                     [(ngModel)]="user.cpf" #cpfCtrl="ngModel"
                     (ngModelChange)="onCpfChange($event)"
                     pattern="^\d{3}\.\d{3}\.\d{3}-\d{2}$" maxlength="14"
                     placeholder="000.000.000-00"
                     [class.is-invalid]="cpfCtrl.invalid && cpfCtrl.touched" required />
              <div class="invalid-feedback">Digite um CPF válido.</div>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Telefone:</label>
              <input type="tel" class="form-control" name="phone" 
                     [(ngModel)]="user.phone" #phoneCtrl="ngModel"
                     (input)="formatPhone($event)" maxlength="15"
                     placeholder="(00) 00000-0000"
                     [class.is-invalid]="phoneCtrl.invalid && phoneCtrl.touched" required />
            </div>

          </div>

          <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-outline-secondary" (click)="navigateToLogin()">
              Voltar
            </button>
            
            <button type="button" class="btn btn-primary px-4"
                    [disabled]="nameCtrl.invalid || emailCtrl.invalid || cpfCtrl.invalid || phoneCtrl.invalid"
                    (click)="nextStep()">
              Próximo
            </button>
          </div>
        </div>

        <div *ngIf="currentStep === 2">
          <div class="row">
            
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">CEP:</label>
              <div class="input-group">
                <input type="text" class="form-control" name="zipCode"
                       [(ngModel)]="user.address.zipCode" #cepCtrl="ngModel"
                       (blur)="onZipCodeBlur()" (input)="formatZipCode($event)"
                       maxlength="9" placeholder="00000-000"
                       [class.is-invalid]="cepCtrl.invalid && cepCtrl.touched" required />
                <span class="input-group-text" *ngIf="isAddressLoading">
                  <span class="spinner-border spinner-border-sm"></span>
                </span>
              </div>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Rua/Logradouro:</label>
              <input type="text" class="form-control" name="street"
                     [(ngModel)]="user.address.street" required />
            </div>

            <div class="col-md-4 mb-3">
              <label class="form-label fw-bold">Número:</label>
              <input type="text" class="form-control" name="number"
                     [(ngModel)]="user.address.number" required />
            </div>

            <div class="col-md-8 mb-3">
              <label class="form-label fw-bold">Complemento (Opcional):</label>
              <input type="text" class="form-control" name="complement"
                     [(ngModel)]="user.address.complement" />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Bairro:</label>
              <input type="text" class="form-control" name="neighborhood"
                     [(ngModel)]="user.address.neighborhood" required />
            </div>

            <div class="col-md-4 mb-3">
              <label class="form-label fw-bold">Cidade:</label>
              <input type="text" class="form-control" name="city"
                     [(ngModel)]="user.address.city" required />
            </div>

            <div class="col-md-2 mb-3">
              <label class="form-label fw-bold">Estado:</label>
              <input type="text" class="form-control" name="state"
                     [(ngModel)]="user.address.state" required />
            </div>

          </div>

          <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-outline-secondary" (click)="prevStep()">
              Voltar
            </button>
            
            <button type="submit" class="btn btn-primary px-4"
                    [disabled]="registerForm.invalid || isAddressLoading">
              Cadastrar
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
